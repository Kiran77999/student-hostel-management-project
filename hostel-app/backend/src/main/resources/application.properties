spring.application.name=HostelHub
server.port=${PORT:8080}
spring.profiles.default=demo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hostel;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
server.error.include-message=never
app.admin.email=${ADMIN_EMAIL:admin@hostel.local}
app.admin.password=${ADMIN_PASSWORD:}
spring.sql.init.schema-locations=classpath:schema${DB_SCHEMA_SUFFIX:}.sql
